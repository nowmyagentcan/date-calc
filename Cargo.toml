[package]
name = "date-calc"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Count business days with official public holidays and convert dates between calendars"
repository = "https://github.com/nowmyagentcan/date-calc"
publish = false

[dependencies]
anstream = "1.0.0"
clap = { version = "4.6.7", features = ["derive"] }
icu_calendar = { version = "2.4.0", default-features = false }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always", "serde"] }
jiff-tzdb = "0.1.9"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# jiff-tzdb 0.1.9 on crates.io carries tzdata 2026e; this copy is regenerated from 2026f
# by scripts/vendor-tzdb.sh. Drop the patch once crates.io ships 2026f or newer.
[patch.crates-io]
jiff-tzdb = { path = "vendor/jiff-tzdb" }
