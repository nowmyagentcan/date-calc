<style>
:root { --bg:#fafaf9; --fg:#1c1b1a; --muted:#6b6966; --line:#e7e5e2; --field:#f2f1ef; --accent:#0f7b4a; --danger:#b42318; --r:8px;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root { --bg:#121110; --fg:#ecebe9; --muted:#9a9894; --line:#2a2826; --field:#1b1a19; --accent:#5fd38d; --danger:#f97066; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 18px 16px 12px; display: grid; gap: 12px; }
h1 { margin: 0; font-size: 18px; font-weight: 600; text-align: center; letter-spacing: -0.01em; }
p { margin: 0; }
svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
.visual { width: auto; height: 64px; justify-self: center; color: var(--muted); }
form { display: grid; gap: 12px; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
input { width: 100%; min-height: 40px; padding: 8px 10px; font: inherit; font-size: 15px; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: var(--r); }
input::placeholder { color: var(--muted); opacity: 1; }
input:disabled { opacity: .55; cursor: not-allowed; }
#query { font: 18px/1.4 var(--mono); padding: 10px 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.three { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 12px; margin-top: 10px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 10px; }
.checks label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fg); }
.checks input { width: 16px; min-height: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
summary { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; list-style: none; border-radius: var(--r); }
summary::-webkit-details-marker { display: none; }
details[open] summary svg { transform: rotate(90deg); }
button { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 10px; font: inherit; font-size: 14px; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; }
button:active { transform: translateY(1px); }
.go { justify-self: center; min-height: 40px; padding: 8px 32px; font-size: 15px; font-weight: 600; color: var(--bg); background: var(--accent); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#out { display: grid; gap: 10px; min-height: 88px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); align-content: start; }
.muted, .dim { color: var(--muted); }
.examples { display: flex; flex-wrap: wrap; gap: 8px; }
.examples code { font: 14px var(--mono); }
.examples span { color: var(--muted); }
.bar { height: 3px; overflow: hidden; border-radius: var(--r); }
.bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--accent); animation: slide 1.1s linear infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { .bar::after { width: 100%; animation: none; } }
.head { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
.big { font-size: 28px; font-weight: 650; line-height: 1.2; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.big span { font-size: 17px; font-weight: 500; letter-spacing: 0; }
.acts { display: flex; gap: 8px; }
.sub { font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 4px; }
.data { font-size: 13px; color: var(--muted); }
ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
li, .err { display: flex; gap: 8px; align-items: baseline; }
li svg, .err svg { position: relative; top: 3px; }
table { border-collapse: collapse; font-size: 14px; }
td { padding: 3px 20px 0 0; vertical-align: top; }
td:first-child { white-space: nowrap; }
td:last-child { padding-right: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.note { display: block; font-size: 13px; color: var(--muted); }
.err { color: var(--danger); font-weight: 600; }
.hint { padding-left: 24px; }
footer { display: flex; justify-content: center; align-items: center; gap: 16px; font-size: 13px; }
footer a { display: inline-flex; color: var(--muted); border-radius: 4px; }
footer a:hover { color: var(--fg); }
footer svg { width: 18px; height: 18px; }
@media (max-width: 520px) { .two, .three, .head { grid-template-columns: 1fr; } }

        </label>
        <label>Time zone

        </label>

    regional: [hol("2026-01-06", "TUE", "Epiphany", { regions: ["Augsburg", "BW", "BY", "ST"] }), hol("2026-03-08", "SUN", "Women's Day", { regions: ["BE", "MV"] }), hol("2026-04-05", "SUN", "Easter Sunday", { regions: ["BB"] }), hol("2026-05-24", "SUN", "Pentecost", { regions: ["BB"] }), hol("2026-06-04", "THU", "Corpus Christi", { regions: ["Augsburg", "BW", "BY", "HE", "NW", "RP", "SL"] }), hol("2026-08-08", "SAT", "Augsburg Peace Festival", { regions: ["Augsburg"] }), hol("2026-08-15", "SAT", "Assumption Day", { regions: ["Augsburg", "SL"] }), hol("2026-09-20", "SUN", "World Children's Day", { regions: ["TH"] }), hol("2026-10-31", "SAT", "Reformation Day", { regions: ["BB", "HB", "HH", "MV", "NI", "SH", "SN", "ST", "TH"] }), hol("2026-11-01", "SUN", "All Saints' Day", { regions: ["Augsburg", "BW", "BY", "NW", "RP", "SL"] }), hol("2026-11-18", "WED", "Repentance and Prayer Day", { regions: ["SN"] })],
    weekend_workdays: [], weekend: ["SAT", "SUN"], warnings: [], data: D },
    text: "Germany · 2026 · 9 national holidays\n  Thu 2026-01-01  New Year's Day\n  Fri 2026-04-03  Good Friday\n  Mon 2026-04-06  Easter Monday\n  Fri 2026-05-01  Labor Day\n  Thu 2026-05-14  Ascension Day\n  Mon 2026-05-25  Pentecost Monday\n  Sat 2026-10-03  German Unity Day\n  Fri 2026-12-25  Christmas Day\n  Sat 2026-12-26  Second Day of Christmas\nRegional:\n  Tue 2026-01-06  Epiphany                   Augsburg, BW, BY, ST\n  Sun 2026-03-08  Women's Day                BE, MV\n  Sun 2026-04-05  Easter Sunday              BB\n  Sun 2026-05-24  Pentecost                  BB\n  Thu 2026-06-04  Corpus Christi             Augsburg, BW, BY, HE, NW, RP, SL\n  Sat 2026-08-08  Augsburg Peace Festival    Augsburg\n  Sat 2026-08-15  Assumption Day             Augsburg, SL\n  Sun 2026-09-20  World Children's Day       TH\n  Sat 2026-10-31  Reformation Day            BB, HB, HH, MV, NI, SH, SN, ST, TH\n  Sun 2026-11-01  All Saints' Day            Augsburg, BW, BY, NW, RP, SL\n  Wed 2026-11-18  Repentance and Prayer Day  SN\npython-holidays 0.107 (2026-10-19)\n" },
  "2026-10-27": { op: "convert", result: { input: "2026-10-27", from: "gregorian", gregorian: { date: "2026-10-27", weekday: "TUE", iso_week: "2026-W44", day_of_year: 300 },
    dates: [
      { calendar: "islamic-umalqura", text: "16 Jumada al-Ula 1448 AH", note: "Saudi Arabia's official Umm al-Qura calendar. Religious dates set by moon sighting can differ by a day, and more in other countries." },
      { calendar: "islamic-civil", text: "15 Jumada al-Ula 1448 AH", note: "Tabular Islamic calendar (Friday epoch, 30-year cycle); usually 0-2 days from Umm al-Qura." },
      { calendar: "hebrew", text: "16 Cheshvan 5787", note: null },
      { calendar: "chinese", text: "Month 9, day 18, year of the Horse (Bing-Wu)", note: null },
      { calendar: "persian", text: "5 Aban 1405 SH", note: null },
      { calendar: "bikram-sambat", text: "10 Kartik 2083 BS", note: null }],
    warnings: [], data: D },
    text: "Gregorian              Tue 2026-10-27 · week 2026-W44 · day 300\nIslamic (Umm al-Qura)  16 Jumada al-Ula 1448 AH\n                       Saudi Arabia's official Umm al-Qura calendar. Religious dates set by moon sighting can differ by a day, and more in other countries.\nIslamic (tabular)      15 Jumada al-Ula 1448 AH\n                       Tabular Islamic calendar (Friday epoch, 30-year cycle); usually 0-2 days from Umm al-Qura.\nHebrew                 16 Cheshvan 5787\nChinese                Month 9, day 18, year of the Horse (Bing-Wu)\nPersian                5 Aban 1405 SH\nBikram Sambat          10 Kartik 2083 BS\nicu_calendar 2.4.0 · nepali-datetime 1.0.8.5 (2026-05-07)\n" },
};
const REGIONS = {
  DE: [["BB", "Brandenburg"], ["BE", "Berlin"], ["BW", "Baden-Württemberg"], ["BY", "Bayern"], ["HB", "Bremen"], ["HE", "Hessen"], ["HH", "Hamburg"], ["MV", "Mecklenburg-Vorpommern"], ["NI", "Niedersachsen"], ["NW", "Nordrhein-Westfalen"], ["RP", "Rheinland-Pfalz"], ["SH", "Schleswig-Holstein"], ["SL", "Saarland"], ["SN", "Sachsen"], ["ST", "Sachsen-Anhalt"], ["TH", "Thüringen"], ["Augsburg"]],
  GB: [["ENG", "England"], ["NIR", "Northern Ireland"], ["SCT", "Scotland"], ["WLS", "Wales"]],
};
const COUNTRIES = [["AE", "United Arab Emirates"], ["CN", "China"], ["DE", "Germany"], ["GB", "United Kingdom"], ["IN", "India"], ["JP", "Japan"], ["US", "United States"]];

// Sample answers in the shapes `date-calc ui` returns: {op, result, text} or {error}.
async function api(body) {
  if (body.op === "countries") {
    if (!body.country) return { op: "countries", result: { countries: COUNTRIES.map(([code, name]) => ({ code, name })), data: D } };
    const c = COUNTRIES.find(([code, name]) => [code, name].some(s => s.toLowerCase() === body.country.toLowerCase()));
    if (!c) return { error: { code: "unknown_country", message: `Unknown country: '${body.country}'.`, hint: "Use an ISO code such as DE or DEU, or run: date-calc countries" } };
    return { op: "countries", result: { code: c[0], name: c[1], regions: (REGIONS[c[0]] ?? []).map(([code, ...names]) => ({ code, names })), data: D } };
  }
  return SAMPLES[body.query.trim()] ?? { error: { code: "bad_query", message: `Couldn't read '${body.query}'.`, hint: "Try: 2026-02-01 to 2026-02-28 · 2026-11-02 +10 · 2027 · 2026-10-27 · 1 Ramadan 1448" } };
}

const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const day = d => `${DAYS[new Date(d.slice(0, 10) + "T00:00Z").getUTCDay()]} ${d.slice(0, 10)}`;
const when = s => s.length > 10 ? `${day(s)} ${s.slice(11, s.slice(16, 19) === ":00" ? 16 : 19)} ${s.slice(19)}`.trimEnd() : day(s);
const count = (n, word) => `${n} ${word}${Math.abs(n) === 1 ? "" : "s"}`;
const place = r => !r.country ? "No country" : r.country.name + (r.region ? `, ${r.region.name}${r.region.name === r.region.code ? "" : ` (${r.region.code})`}` : "");
const flags = h => [h.observed && "observed", h.estimated && "estimated", h.scope === "regional" && "regional", h.except_regions && `not in ${h.except_regions.join(", ")}`].filter(Boolean).join(", ");
const table = rows => `<table>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
const dayCell = d => `<span class="mono">${day(d)}</span>`;
const holidayRows = list => list.map(h => [dayCell(h.date), esc(h.name), `<span class="dim">${esc(flags(h))}</span>`]);
const lines = (...ls) => `<p class="muted">${ls.filter(Boolean).map(esc).join("<br>")}</p>`;
const big = (value, words) => `<p class="big">${esc(value)}${words ? ` <span>${esc(words)}</span>` : ""}</p>`;
const ENDS = ["ends not counted", "start not counted", "end not counted", "both counted"];
const UNITS = { business_days: "business day", days: "day", weeks: "week", months: "month", years: "year", business_hours: "business hour" };
const CALENDARS = { gregorian: "Gregorian", "islamic-umalqura": "Islamic (Umm al-Qura)", "islamic-civil": "Islamic (tabular)", hebrew: "Hebrew", chinese: "Chinese", persian: "Persian", "bikram-sambat": "Bikram Sambat" };

// Each view returns [headline, details] for one operation's result.
const VIEWS = {
  between: r => [big(r.business_days, count(r.business_days, "business day").replace(/^\S+ /, "")),
    lines(`${r.start} to ${r.end} (${ENDS[2 * r.include_start + r.include_end]}) · ${place(r)}`,
      `${count(r.calendar_days, "day")}: ${r.weekend_days} weekend, ${count(r.holiday_days, "holiday")} · ${count(Math.abs(r.elapsed_days), "day")} apart`)
    + (r.holidays.length ? table(holidayRows(r.holidays)) : "")],
  add: r => {
    const rolled = r.unit !== "business_days" && r.unit !== "business_hours";
    const n = r.skipped.length + (r.skipped_more ?? 0);
    return [big(when(r.result)),
      lines(`${count(Math.abs(r.amount), UNITS[r.unit])} ${r.amount < 0 ? "before" : "after"} ${when(r.start)} · ${place(r)}`, r.hours && `Hours ${r.hours} · ${r.timezone ?? "clock time"}`)
      + (n ? `<p class="sub">${rolled ? `Rolled ${r.roll} past` : "Skipped"} ${count(n, "day")}</p>`
        + table(r.skipped.map(s => [dayCell(s.date), s.reason === "weekend" ? `<span class="dim">weekend</span>` : esc(s.name)]))
        + (r.skipped_more ? lines(`and ${r.skipped_more} more`) : "") : "")];
  },
  hours: r => [big(r.duration, `business hours (${r.business_hours.toFixed(2)} h)`),
    lines(`${when(r.start)} to ${when(r.end)} · ${place(r)}`, `Hours ${r.hours} on ${count(r.business_days, "business day")} · ${r.timezone ?? "clock time"}`)
    + (r.holidays.length ? table(holidayRows(r.holidays)) : "")],
  holidays: r => [big(r.holidays.length, r.region ? "holidays" : "national holidays"),
    lines(`${place(r)} · ${r.from.endsWith("-01-01") && r.to === r.from.slice(0, 4) + "-12-31" ? r.from.slice(0, 4) : `${r.from} to ${r.to}`}`)
    + table(holidayRows(r.holidays))
    + (r.regional.length ? `<p class="sub">Only in some regions</p>` + table(r.regional.map(h => [dayCell(h.date), esc(h.name), `<span class="dim">${esc(h.regions.join(", "))}</span>`])) : "")],
  convert: r => [big(day(r.gregorian.date)),
    lines(`${r.from === "gregorian" ? "" : `${r.input}, ${CALENDARS[r.from]} · `}Week ${r.gregorian.iso_week} · day ${r.gregorian.day_of_year} of the year`)
    + table(r.dates.map(d => [`<span class="dim">${CALENDARS[d.calendar]}</span>`, esc(d.text) + (d.note ? `<span class="note">${esc(d.note)}</span>` : "")]))],
};

function done({ op, result: r, text }) {
  const [headline, details] = VIEWS[op](r);
  out.dataset.text = text;
  out.innerHTML = `<div class="head">${headline}<div class="acts"><button type="button" data-copy>${COPY}Copy</button><button type="button" data-save>${SAVE}Save</button></div></div>`
    + details
    + (r.weekend_workdays?.length ? lines(`Worked weekend days: ${r.weekend_workdays.map(day).join(", ")}`) : "")
    + (r.warnings.length ? `<ul>${r.warnings.map(w => `<li>${WARN}<span>${esc(w.message)}</span></li>`).join("")}</ul>` : "")
    + `<p class="data">${esc(op === "convert" ? `${r.data.calendars} · ${r.data.bikram_sambat}` : r.data.holidays + (r.timezone ? ` · tzdata ${r.data.tzdata}` : ""))}</p>`;
}

const failure = e => `<p class="err">${FAIL}<span>${esc(e.message)}</span></p>` + (e.hint ? `<p class="hint">${esc(e.hint)}</p>` : "");

let latest = 0, wait;
form.addEventListener("submit", async ev => {
  ev.preventDefault();
  const run = ++latest;
  const body = { query: query.value, include_start: $("#include_start").checked, include_end: $("#include_end").checked };
  for (const id of ["country", "region", "weekend", "hours", "timezone"]) if ($("#" + id).value.trim()) body[id] = $("#" + id).value.trim();
  // One loading timer for the newest submit only, so an older one can't cover its result.
  clearTimeout(wait);
  wait = setTimeout(() => {
    out.setAttribute("aria-busy", "true");
    out.innerHTML = `<div class="bar" role="progressbar" aria-label="Working"></div><p class="muted">Calculating…</p>`;
  }, 150);
  let a;
  try { a = await api(body); } catch { a = { error: { message: "Can't reach date-calc.", hint: "Start it again with: date-calc ui" } }; }
  if (run !== latest) return;
  clearTimeout(wait);
  out.removeAttribute("aria-busy");
  if (a.error) out.innerHTML = failure(a.error); else done(a);
});

country.addEventListener("change", async () => {
  region.value = "";
  region.disabled = true;
  $("#regions").innerHTML = "";
  const value = country.value.trim();
  const a = value && await api({ op: "countries", country: value }).catch(() => null);
  if (a?.result?.regions?.length && value === country.value.trim()) {
    $("#regions").innerHTML = options(a.result.regions, x => x.code, x => x.names.join(", ") || x.code);
    region.disabled = false;
  }
});

out.addEventListener("click", async ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.ex) {
    query.value = b.dataset.ex;
    country.value = b.dataset.country;
    country.dispatchEvent(new Event("change"));
    form.requestSubmit();
    return;
  }
  if (b.hasAttribute("data-save")) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([out.dataset.text], { type: "text/plain" }));
    a.download = "date-calc.txt";
    a.click();
    URL.revokeObjectURL(a.href);
    return;
  }
  const label = b.lastChild;
  try { await navigator.clipboard.writeText(out.dataset.text); label.textContent = "Copied"; }
  catch { label.textContent = "Can't copy"; }
  setTimeout(() => { label.textContent = "Copy"; }, 1500);
});

addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "o") { ev.preventDefault(); query.focus(); query.select(); }
});

$("#zones").innerHTML = options(["UTC", ...(Intl.supportedValuesOf?.("timeZone") ?? [])], z => z, z => z);
api({ op: "countries" }).then(a => { $("#countries").innerHTML = options(a.result.countries, c => c.code, c => c.name); }, () => {});
</script>
</body>
